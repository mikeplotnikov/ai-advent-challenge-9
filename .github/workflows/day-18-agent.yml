name: "Day 18: agent 24/7"

# The day-18 agent lives here: every hour the MCP server polls the CBR for due watches
# (-once), then the agent writes a digest if its 3-hour slot has none yet (-tick).
# State is JSON on the day-18-state branch; the showcase page reads it from there.
# Stop: `gh workflow disable day-18-agent.yml`; it also stops itself after STOP_AFTER.

on:
  schedule:
    # Minute 23, not 00: GitHub warns that scheduled runs are delayed at the top of the hour.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      question:
        description: 'Вопрос агенту (необязательно), например «Следи за курсами доллара, евро и юаня — проверяй ЦБ раз в час»'
        required: false
        default: ''
        type: string
      request_id:
        description: 'Метка вопроса с витрины (32 hex). С ней сервер работает в гостевом режиме'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# One run at a time on the state branch; waiting runs queue in order instead of replacing
# each other, so a dispatched question is never dropped in favour of a scheduled tick.
concurrency:
  group: day-18-state
  cancel-in-progress: false
  queue: max

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STOP_AFTER: '2026-10-20T00:00:00Z'
      STORE: state/day-18/store.json
      DIGESTS: state/day-18/digests.json
      QUESTIONS: state/day-18/questions.json
      TOOLS: state/day-18/tools.json
      QUESTIONS_PER_HOUR: '12'
    steps:
      - name: Stop date
        id: gate
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d "$STOP_AFTER" +%s)" ]; then
            echo "день 18 остановлен по дате ($STOP_AFTER)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Check out the state branch into state/
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin day-18-state >/dev/null; then
            git fetch --depth 1 origin day-18-state:day-18-state
            git worktree add state day-18-state
          else
            echo "ветки day-18-state ещё нет — создаю её без общей истории с main"
            git worktree add --orphan -b day-18-state state
          fi
          mkdir -p state/day-18

      # The strict limit on showcase questions. Runs of this workflow never overlap (the
      # concurrency group), so counting answered questions here is atomic — unlike the
      # showcase function's pre-check, which a parallel burst can slip past. An over-limit run
      # records a refusal and skips everything else: seconds, and no model call.
      - name: Strict limit on showcase questions
        id: limit
        if: steps.gate.outputs.run == 'true'
        env:
          QUESTION: ${{ inputs.question }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, re, sys
          out = open(os.environ['GITHUB_OUTPUT'], 'a')
          rid = os.environ.get('REQUEST_ID', '')
          if not rid:
              out.write('ask=true\n'); sys.exit(0)
          if not re.fullmatch(r'[0-9a-f]{32}', rid):
              # Only a manual dispatch can send this (the showcase makes its own ids). A record
              # under an invalid id could never be found, so the run just fails loudly.
              print('request_id не 32 hex — вопрос не задаётся'); out.write('ask=false\n'); sys.exit(1)
          path = os.environ['QUESTIONS']
          records = json.load(open(path)) if os.path.exists(path) else []
          now = datetime.datetime.now(datetime.timezone.utc)
          hour_ago = now - datetime.timedelta(hours=1)
          recent = [r for r in records if r.get('request_id') and datetime.datetime.fromisoformat(r['at'].replace('Z', '+00:00')) >= hour_ago]
          limit = int(os.environ['QUESTIONS_PER_HOUR'])
          if len(recent) < limit:
              out.write('ask=true\n'); sys.exit(0)
          print(f'вопросов с витрины за час: {len(recent)} из {limit} — лимит исчерпан, агент не запускается')
          records.append({
              'request_id': rid, 'at': now.strftime('%Y-%m-%dT%H:%M:%SZ'), 'question': os.environ.get('QUESTION', ''),
              'answer': '', 'error': 'лимит вопросов на час исчерпан', 'model': '', 'model_calls': 0, 'tool_calls': [],
              'tokens': {'prompt': 0, 'cached': 0, 'output': 0, 'per_call': []}, 'cost': 0, 'cost_known': True,
          })
          # Atomic like the Go writer: a cut-off run must not leave a truncated file, which the
          # agent would then refuse to touch. No lock needed — runs are serialized and the agent
          # is not writing at this point.
          tmp = path + '.tmp'
          with open(tmp, 'w') as f:
              json.dump(records[-100:], f, ensure_ascii=False, indent=2)
              f.write('\n')
              f.flush(); os.fsync(f.fileno())
          os.replace(tmp, path)
          out.write('ask=false\n'); out.write('full=true\n')
          PY

      - name: Set up Go
        if: steps.gate.outputs.run == 'true' && steps.limit.outputs.full != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build the agent and the MCP server
        if: steps.gate.outputs.run == 'true' && steps.limit.outputs.full != 'true'
        run: |
          go build -o bin/day18 ./day-18
          go build -o bin/day18-mcp ./day-18/mcp-server

      - name: Poll due watches (server -once)
        id: poll
        if: steps.gate.outputs.run == 'true' && steps.limit.outputs.full != 'true'
        continue-on-error: true
        run: bin/day18-mcp -store "$STORE" -once

      - name: Ask the agent (dispatch with a question)
        id: question
        if: steps.gate.outputs.run == 'true' && inputs.question != '' && steps.limit.outputs.ask == 'true'
        continue-on-error: true
        env:
          # Inputs reach the shell only as environment variables, never pasted into the script
          # text, so they cannot become shell syntax.
          QUESTION: ${{ inputs.question }}
          REQUEST_ID: ${{ inputs.request_id }}
          DEEPSEEK_API_KEY_DAY18: ${{ secrets.DEEPSEEK_API_KEY_DAY18 }}
        run: |
          set -euo pipefail
          # A showcase question (it carries a request_id) runs the server in guest mode: guests
          # may create up to three day-long watches and stop nothing.
          if [ -n "$REQUEST_ID" ]; then
            bin/day18 -questions "$QUESTIONS" -request-id "$REQUEST_ID" -command "bin/day18-mcp -store $STORE -guest" -- "$QUESTION"
          else
            bin/day18 -questions "$QUESTIONS" -command "bin/day18-mcp -store $STORE" -- "$QUESTION"
          fi
          # "--" ends the flags: a question that starts with "-" is a question, not a flag
          # (security audit, wave 1 — such a question used to exit before writing a record).

      - name: Digest if its slot is due (agent -tick)
        id: digest
        if: steps.gate.outputs.run == 'true' && steps.limit.outputs.full != 'true'
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY_DAY18: ${{ secrets.DEEPSEEK_API_KEY_DAY18 }}
        run: bin/day18 -tick -digest-every 3h -window 24h -digests "$DIGESTS" -tools "$TOOLS" -command "bin/day18-mcp -store $STORE"

      # Every showcase question must leave a record, whatever happened to the agent: the
      # strict hourly limit above counts records, so a run that wrote none would not count.
      - name: Make sure the showcase question is recorded
        if: always() && steps.gate.outputs.run == 'true' && inputs.request_id != '' && steps.limit.outcome == 'success' && steps.limit.outputs.full != 'true'
        env:
          QUESTION: ${{ inputs.question }}
          REQUEST_ID: ${{ inputs.request_id }}
          OUTCOME: ${{ steps.question.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os
          path, rid = os.environ['QUESTIONS'], os.environ['REQUEST_ID']
          records = json.load(open(path)) if os.path.exists(path) else []
          if any(r.get('request_id') == rid for r in records):
              print('запись вопроса есть'); raise SystemExit(0)
          print('агент не записал вопрос — дописываю запись об ошибке, чтобы лимит её посчитал')
          records.append({
              'request_id': rid, 'at': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'question': os.environ.get('QUESTION', ''), 'answer': '',
              'error': f"агент не записал ответ (шаг вопроса: {os.environ.get('OUTCOME') or 'не выполнялся'})",
              'model': '', 'model_calls': 0, 'tool_calls': [],
              'tokens': {'prompt': 0, 'cached': 0, 'output': 0, 'per_call': []}, 'cost': 0, 'cost_known': True,
          })
          # Atomic like the Go writer: a cut-off run must not leave a truncated file, which the
          # agent would then refuse to touch. No lock needed — runs are serialized and the agent
          # is not writing at this point.
          tmp = path + '.tmp'
          with open(tmp, 'w') as f:
              json.dump(records[-100:], f, ensure_ascii=False, indent=2)
              f.write('\n')
              f.flush(); os.fsync(f.fileno())
          os.replace(tmp, path)
          PY

      # Always commit what was collected, even when a step above failed: polls are data.
      - name: Commit the state
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          cd state
          git add -A
          if git diff --cached --quiet; then
            echo "состояние не изменилось"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "day-18 state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin day-18-state

      - name: Fail the job if the poll, the question or the digest failed
        if: always() && steps.gate.outputs.run == 'true'
        env:
          POLL: ${{ steps.poll.outcome }}
          QUESTION: ${{ steps.question.outcome }}
          DIGEST: ${{ steps.digest.outcome }}
        run: |
          echo "опрос: $POLL · вопрос: $QUESTION · сводка: $DIGEST"
          for outcome in "$POLL" "$QUESTION" "$DIGEST"; do
            if [ "$outcome" = "failure" ]; then exit 1; fi
          done
