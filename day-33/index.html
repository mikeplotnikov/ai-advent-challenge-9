<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Парта · поддержка</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e1dc; --accent:#2f6f5e; --user:#e8f1ee; --mcp:#3b5bdb; --rag:#a35c00; --tool:#7b2cbf; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header b { font-size:18px; }
  header span { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns:320px 1fr; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; text-transform:uppercase; letter-spacing:.04em; }
  select, textarea, button { font:inherit; }
  select { width:100%; padding:7px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .ticket { margin-top:12px; padding:10px; background:var(--bg); border-radius:8px; font-size:14px; }
  .ticket .subj { font-weight:600; }
  .ticket .msg { margin-top:6px; color:var(--muted); white-space:pre-wrap; }
  .note { font-size:12px; color:var(--muted); margin-top:12px; }
  #chat { display:flex; flex-direction:column; min-height:70vh; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-bottom:12px; }
  .bubble { max-width:85%; padding:10px 12px; border-radius:10px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .bubble.user { align-self:flex-end; background:var(--user); }
  .bubble.bot { align-self:flex-start; background:var(--bg); border:1px solid var(--line); }
  .bubble.err { align-self:flex-start; background:#fdecea; color:#8a1c12; }
  details { margin-top:8px; font-size:12.5px; white-space:normal; }
  summary { cursor:pointer; color:var(--muted); }
  .step { margin:6px 0 0; }
  .step .k { display:inline-block; min-width:44px; font-weight:600; }
  .k.mcp { color:var(--mcp); } .k.rag { color:var(--rag); } .k.tool { color:var(--tool); }
  .step pre { margin:4px 0 0 48px; padding:6px; background:#fff; border:1px solid var(--line); border-radius:6px; white-space:pre-wrap; max-height:160px; overflow:auto; font-size:11.5px; }
  .totals { margin-top:6px; color:var(--muted); }
  form { display:flex; gap:8px; border-top:1px solid var(--line); padding-top:12px; }
  textarea { flex:1; resize:vertical; min-height:44px; padding:8px; border:1px solid var(--line); border-radius:6px; }
  button { padding:0 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header><b>Парта · поддержка</b><span>AI-ассистент: RAG по FAQ и документации + CRM через MCP · DeepSeek</span><span id="asof"></span></header>
<main>
  <section class="panel">
    <label for="user">Войти как (демо, без авторизации)</label>
    <select id="user"></select>
    <label for="ticket">Тикет</label>
    <select id="ticket"></select>
    <div class="ticket" id="card"></div>
    <p class="note">Данные вымышленные. Ассистент видит профиль и тикет только выбранного пользователя.</p>
  </section>
  <section class="panel" id="chat">
    <div id="log"></div>
    <form id="form">
      <textarea id="msg" placeholder="Например: почему не работает авторизация?" maxlength="1000"></textarea>
      <button id="send">Спросить</button>
    </form>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let users = [], turns = [];
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

function current() {
  const u = users.find(u => u.id === $('user').value);
  return { u, t: u && u.tickets.find(t => t.id === $('ticket').value) };
}
function fillTickets() {
  const { u } = current();
  $('ticket').replaceChildren(...u.tickets.map(t => { const o = el('option', '', `${t.id} · ${t.subject}`); o.value = t.id; return o; }));
  showTicket();
}
function showTicket() {
  const { u, t } = current();
  turns = [];
  $('log').replaceChildren();
  const card = $('card');
  card.replaceChildren(el('div', 'subj', `${t.id} · ${t.subject}`), el('div', '', `${u.name} · тариф ${u.plan} · ${t.status}`));
  for (const m of t.messages) card.append(el('div', 'msg', `«${m.text}»`));
}
function stepsBlock(r) {
  const d = el('details');
  d.append(el('summary', '', `Как получен ответ: MCP ${r.steps.filter(s => s.kind === 'mcp').length + r.tools_used.length}, RAG ${r.steps.filter(s => s.kind === 'rag').length}`));
  const names = { mcp: 'MCP', rag: 'RAG', tool: 'Модель' };
  for (const s of r.steps) {
    const row = el('div', 'step');
    row.append(el('span', 'k ' + s.kind, names[s.kind]), document.createTextNode(s.title));
    if (s.detail) row.append(el('pre', '', s.detail));
    d.append(row);
  }
  const cost = r.cost_usd === undefined ? 'цена неизвестна' : `$${r.cost_usd.toFixed(5)}`;
  d.append(el('div', 'totals', `обращений к модели ${r.model_calls} · токены: вход ${r.prompt_tokens} (кэш ${r.cached_tokens}), выход ${r.output_tokens} · ${cost} · ${r.seconds.toFixed(1)} с`));
  return d;
}
async function ask(ev) {
  ev.preventDefault();
  const text = $('msg').value.trim();
  if (!text) return;
  const { u, t } = current();
  $('log').append(el('div', 'bubble user', text));
  $('msg').value = '';
  $('send').disabled = true;
  const wait = el('div', 'bubble bot', 'Смотрю тикет и документацию…');
  $('log').append(wait);
  wait.scrollIntoView({ block: 'end' });
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: u.id, ticket_id: t.id, history: turns.slice(-12), message: text }) });
    const r = await res.json();
    if (!res.ok) throw new Error(r.error || res.status);
    wait.textContent = r.answer;
    wait.append(stepsBlock(r));
    turns.push({ role: 'user', content: text }, { role: 'assistant', content: r.answer });
  } catch (e) {
    wait.className = 'bubble err';
    wait.textContent = 'Ошибка: ' + e.message;
  } finally {
    $('send').disabled = false;
    wait.scrollIntoView({ block: 'end' });
  }
}
$('msg').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) ask(e); });
$('form').addEventListener('submit', ask);
$('user').addEventListener('change', fillTickets);
$('ticket').addEventListener('change', showTicket);
fetch('/api/users').then(r => r.json()).then(d => {
  users = d.users;
  $('asof').textContent = 'срез CRM: ' + d.as_of;
  $('user').replaceChildren(...users.map(u => { const o = el('option', '', `${u.name} (${u.id})`); o.value = u.id; return o; }));
  fillTickets();
});
</script>
</body>
</html>
