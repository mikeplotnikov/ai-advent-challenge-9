<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Чат с DeepSeek — день 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
  :root {
    --ground: #0E1116;
    --surface: #161A21;
    --surface-2: #1D222B;
    --ink: #E8EBF1;
    --muted: #8B94A4;
    --line: #2C333F;
    --ember: #F0774C;
    --display: "Bricolage Grotesque", Helvetica, Arial, sans-serif;
    --body: "Source Serif 4", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body); font-size: 17px; line-height: 1.6;
    display: flex; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    width: min(820px, 100%); height: 100%;
    display: grid; grid-template-rows: auto 1fr auto;
    border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  }

  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  header h1 { font-family: var(--display); font-size: 18px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  header .tag {
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ember); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
  }
  header .hint { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: auto; }

  .feed { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .msg { display: flex; flex-direction: column; gap: 6px; max-width: 85%; }
  .msg .who {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  .msg .bubble {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 16px; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.user .bubble { background: var(--surface-2); border-color: #38414F; white-space: pre-wrap; }
  .msg.bot .who { color: var(--ember); }
  .msg .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child { margin-bottom: 0; }
  .bubble h4 { font-family: var(--display); font-size: 16px; margin: 4px 0 8px; }
  .bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 22px; }
  .bubble li { margin-bottom: 5px; }
  .bubble li::marker { color: var(--ember); }
  .bubble code { font-family: var(--mono); font-size: .87em; background: var(--ground); padding: 1px 5px; border-radius: 4px; }
  .bubble strong { font-weight: 600; }
  .msg.error .bubble { border-color: var(--ember); color: var(--ember); }

  .empty { color: var(--muted); font-size: 16px; margin: auto; text-align: center; max-width: 44ch; }
  .empty b { color: var(--ink); font-weight: 400; }

  .dots { display: inline-flex; gap: 4px; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ember);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .18s; }
  .dots span:nth-child(3) { animation-delay: .36s; }
  @keyframes pulse { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: .6; } }

  form {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 16px 24px 22px; border-top: 1px solid var(--line); background: var(--surface);
  }
  textarea {
    flex: 1; resize: none; font: inherit; font-size: 16px; color: var(--ink);
    background: var(--ground); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; min-height: 52px; max-height: 180px;
  }
  textarea:focus { outline: 2px solid var(--ember); outline-offset: 1px; }
  button {
    font-family: var(--mono); font-size: 13px; letter-spacing: .04em;
    background: var(--ember); color: #17110E; border: 0; border-radius: 10px;
    padding: 15px 20px; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  @media (max-width: 640px) { .feed { padding: 16px; } form { padding: 12px 16px 18px; } .msg { max-width: 100%; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Чат с моделью</h1>
    <span class="tag" id="model">deepseek</span>
    <span class="hint">Enter — отправить · Shift+Enter — перенос строки</span>
  </header>

  <div class="feed" id="feed">
    <p class="empty">День 1 челленджа: браузер отправляет вопрос моему серверу на Go,<br>
      сервер идёт в <b>DeepSeek по REST</b> и возвращает ответ. Ключ живёт только на сервере.</p>
  </div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Спросите что-нибудь…" autofocus></textarea>
    <button type="submit" id="send">Отправить</button>
  </form>
</div>

<script>
(function () {
  "use strict";
  var feed = document.getElementById("feed"),
      form = document.getElementById("form"),
      input = document.getElementById("input"),
      send = document.getElementById("send"),
      modelTag = document.getElementById("model");

  var history = [];   // what we send back to the server: user/assistant turns only
  var busy = false;

  // Models answer in markdown; show it as formatting, not as asterisks.
  function markdown(src) {
    var esc = String(src)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    var out = [], list = null;
    esc.split(/\n/).forEach(function (line) {
      var item = line.match(/^\s*[-*•]\s+(.*)$/);
      var num = line.match(/^\s*(\d+)[.)]\s+(.*)$/);
      if (item || num) {
        var tag = item ? "ul" : "ol";
        if (list !== tag) { if (list) out.push("</" + list + ">"); out.push("<" + tag + ">"); list = tag; }
        out.push("<li>" + inline(item ? item[1] : num[2]) + "</li>");
        return;
      }
      if (list) { out.push("</" + list + ">"); list = null; }
      if (line.trim() === "") { out.push(""); return; }
      var head = line.match(/^\s*(#{1,4})\s+(.*)$/);
      out.push(head ? "<h4>" + inline(head[2]) + "</h4>" : "<p>" + inline(line) + "</p>");
    });
    if (list) out.push("</" + list + ">");
    return out.join("");
  }

  function inline(t) {
    return t
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  }

  function clearEmpty() {
    var empty = feed.querySelector(".empty");
    if (empty) empty.remove();
  }

  function bubble(role, text, meta) {
    clearEmpty();
    var wrap = document.createElement("div");
    wrap.className = "msg " + role;
    var who = document.createElement("span");
    who.className = "who";
    who.textContent = role === "user" ? "вы" : role === "error" ? "ошибка" : "модель";
    var body = document.createElement("div");
    body.className = "bubble";
    if (text instanceof Node) body.appendChild(text);
    else if (role === "bot") body.innerHTML = markdown(text);
    else body.textContent = text;
    wrap.appendChild(who);
    wrap.appendChild(body);
    if (meta) {
      var m = document.createElement("span");
      m.className = "meta";
      m.textContent = meta;
      wrap.appendChild(m);
    }
    feed.appendChild(wrap);
    feed.scrollTop = feed.scrollHeight;
    return wrap;
  }

  function thinking() {
    var dots = document.createElement("span");
    dots.className = "dots";
    dots.innerHTML = "<span></span><span></span><span></span>";
    return bubble("bot", dots);
  }

  function grow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  }
  input.addEventListener("input", grow);

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;
    var text = input.value.trim();
    if (!text) return;

    bubble("user", text);
    history.push({ role: "user", content: text });
    input.value = "";
    grow();

    busy = true;
    send.disabled = true;
    var pending = thinking();

    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        pending.remove();
        if (!res.ok || res.data.error) {
          bubble("error", res.data.error || "что-то пошло не так");
          history.pop();
          return;
        }
        var u = res.data.usage || {};
        var meta = (res.data.model || "") + " · " +
          (u.prompt_tokens || 0) + " + " + (u.completion_tokens || 0) + " токенов";
        if (res.data.request_id) meta += " · запрос " + String(res.data.request_id).slice(0, 8);
        bubble("bot", res.data.reply, meta);
        history.push({ role: "assistant", content: res.data.reply });
        if (res.data.model) modelTag.textContent = res.data.model;
      })
      .catch(function () {
        pending.remove();
        bubble("error", "сервер недоступен");
        history.pop();
      })
      .finally(function () {
        busy = false;
        send.disabled = false;
        input.focus();
      });
  });
})();
</script>
</body>
</html>
